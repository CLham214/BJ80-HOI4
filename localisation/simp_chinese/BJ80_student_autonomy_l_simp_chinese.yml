 BJ80_student_integration_category: "学生自治地区整合"
 BJ80_student_integration_category_desc: "军事占领不能让一个地区真正属于共和国。我们必须建立地方学生委员会、恢复教育秩序，并由当地学生投票决定未来。"
 BJ80_establish_local_student_committee: "建立地方学生委员会"
 BJ80_establish_local_student_committee_desc: "从当地班级和社团中选出代表，组建临时自治机关。"
 BJ80_restore_education_order: "恢复教育秩序"
 BJ80_restore_education_order_desc: "战争已经结束，教室必须重新开放，物资也必须重新分配。"
 BJ80_hold_local_referendum: "举行加入共和国公投"
 BJ80_hold_local_referendum_desc: "由当地学生决定是否正式加入学生共和国。"

 BJ80_autonomy.1.t: "学校属于谁？"
 BJ80_autonomy.1.d: "礼堂里挤满了学生。新政权必须决定怎样使用刚刚掌握的校园资源：发展合作社、投入科研，还是立刻武装起来。"
 BJ80_autonomy.1.a: "建立校园合作社——先给大家富起来！"
 BJ80_autonomy.1.b: "把预算交给实验室和竞赛队。"
 BJ80_autonomy.1.c: "先搬空器材室，把学生军武装起来！"
 BJ80_autonomy.10.t: "学生共和国成立"
 BJ80_autonomy.10.d: "第一面学生共和国旗帜在教学楼上升起。代表们随即围绕共和国的第一份国家预算展开激烈争论。"
 BJ80_autonomy.10.a: "共和国首先属于它的公民。"
 BJ80_autonomy.10.b: "共和国首先必须活下来。"
 BJ80_autonomy.10.c: "教育、工业和国防，我们全都要！"
 BJ80_autonomy.11.t: "第一届学生代表大会"
 BJ80_autonomy.11.d: "第一届代表大会收到三份规模惊人的预算案。合作社、学生军和科研委员会都声称自己的项目将决定共和国的未来。"
 BJ80_autonomy.11.a: "通过八座民用工厂的校园建设案。"
 BJ80_autonomy.11.b: "通过八座军用工厂的紧急国防案。"
 BJ80_autonomy.11.c: "让科学委员会获得一切所需资源。"
 BJ80_autonomy.20.t: "周边学校的回应"
 BJ80_autonomy.20.d: "察南的学生代表愿意接受统一方案，而美苏两国也注意到了这个突然出现的校园共和国。我们只能选择一份立即生效的发展方案。"
 BJ80_autonomy.20.a: "举行联合公投，和平整合整个察南！"
 BJ80_autonomy.20.b: "接受美国投资与安全保证。"
 BJ80_autonomy.20.c: "接受苏联军援与安全保证。"
 BJ80_autonomy.30.t: "自由校园宣言"
 BJ80_autonomy.30.d: "自由校园宣言引起国际关注。美国、苏联和国民政府都愿意保护八十中，但他们能够提供的援助方向并不相同。"
 BJ80_autonomy.30.a: "美国的投资、技术与保独最适合我们。"
 BJ80_autonomy.30.b: "苏联的武器、军工与保独更加实用。"
 BJ80_autonomy.30.c: "接受国民政府保独，同时两头通吃。"
 BJ80_autonomy.31.t: "革命的目标"
 BJ80_autonomy.31.d: "鲁系内部的学生组织与青年军官已经取得优势。他们提出三套方案：完全加入、成为自治附属国，或者在战场上检验各自的理想。"
 BJ80_autonomy.31.a: "举行公投，鲁系全境和平加入共和国！"
 BJ80_autonomy.31.b: "保留鲁系政府，让他们成为我们的附属国。"
 BJ80_autonomy.31.c: "拒绝妥协，准备一场装备充足的统一战争。"
 BJ80_autonomy.40.t: "火种越过北京"
 BJ80_autonomy.40.d: "全国学生解放委员会得到了一笔足以改变战局的资源。代表们提出和平整合、国际援助和极限扩军三套互不相让的计划。"
 BJ80_autonomy.40.a: "能和平整合的全部整合，剩下的钱全造工厂。"
 BJ80_autonomy.40.b: "让美苏共同保独，再建设十五座工厂。"
 BJ80_autonomy.40.c: "十二座军工和两万支步枪——武装全国学生！"
 BJ80_autonomy.41.t: "华北教育革命"
 BJ80_autonomy.41.d: "华北各地的行政机关已经陷入瘫痪，学生委员会事实上控制了京津、河北、察哈尔与山东的重要城市。我们可以立即接管，也可以用国际援助或全面战争完成统一。"
 BJ80_autonomy.41.a: "直接接管京津冀鲁，所有地块无伤加入！"
 BJ80_autonomy.41.b: "同时接受美苏中三方保独与发展援助。"
 BJ80_autonomy.41.c: "获得对国民政府的战争目标和决战物资。"

