l_simp_chinese:
 BJ80_student_autonomy_tree: "学生自治"
 BJ80_the_school_belongs_to_students: "学校属于学生"
 BJ80_the_school_belongs_to_students_desc: "课堂、操场、食堂和宿舍构成了我们的生活。既然学生承担校园的一切，就理应拥有决定校园未来的权利。"
 BJ80_restore_student_congress: "重启学生代表会"
 BJ80_restore_student_congress_desc: "让每个班级、每个年级和每个社团都能派出自己的代表。"
 BJ80_campus_industrial_cooperatives: "校园工业合作社"
 BJ80_campus_industrial_cooperatives_desc: "把维修间、实验室和后勤仓库组织成由学生共同管理的生产合作社。"
 BJ80_convert_unused_classrooms: "改造闲置教室"
 BJ80_convert_unused_classrooms_desc: "黑板可以画工程图，课桌也可以成为装配台。现在，每一平方米空间都必须发挥作用。"
 BJ80_school_industrial_system: "校办工业体系"
 BJ80_school_industrial_system_desc: "仅靠热情无法维持共和国。我们必须建立一套真正能够供应民生与战争的校园工业。"
 BJ80_student_defense_committee: "学生防卫委员会"
 BJ80_student_defense_committee_desc: "没有力量保护的民主，只是一张等待被撕毁的选票。"
 BJ80_establish_student_citizen_army: "建立学生公民军"
 BJ80_establish_student_citizen_army_desc: "军队来自公民，也必须服从由公民选出的代表。"
 BJ80_underground_arsenal_laboratory: "地下军械实验室"
 BJ80_underground_arsenal_laboratory_desc: "竞赛队的知识将第一次被用于制造武器，而不是赢得奖牌。"
 BJ80_democratic_arsenal: "民主兵工厂"
 BJ80_democratic_arsenal_desc: "流水线的轰鸣，将成为保卫学生共和国的最有力演说。"
 BJ80_proclaim_student_republic: "学生共和国成立"
 BJ80_proclaim_student_republic_desc: "从今天起，校园不再由命令统治。八十中的学生将成为自己命运的主人。"
 BJ80_first_student_congress: "第一届学生代表大会"
 BJ80_first_student_congress_desc: "来自每个班级与社团的代表齐聚礼堂，为共和国决定它的第一条道路。"
 BJ80_chaoyang_student_union_plan: "朝阳学生联合计划"
 BJ80_chaoyang_student_union_plan_desc: "八十中不可能永远孤立。我们应当从朝阳区的校园开始建立第一个学生联盟。"
 BJ80_contact_neighboring_schools: "联络周边学校"
 BJ80_contact_neighboring_schools_desc: "秘密刊物、社团交流和竞赛活动，将成为我们穿过围墙的渠道。"
 BJ80_chaoyang_unification_war: "北上察南"
 BJ80_chaoyang_unification_war_desc: "察南政务会横亘在我们向华北发展的道路上。代表大会将授权学生军以武力打通北方门户。完成国策后获得对察南的吞并战争目标。"
 BJ80_integrate_chaoyang_education_zone: "整合朝阳教育区"
 BJ80_integrate_chaoyang_education_zone_desc: "占领不是统一。只有建立学生委员会、恢复教学并举行公投，新地区才会真正成为共和国的一部分。"
 BJ80_free_campus_declaration: "自由校园宣言"
 BJ80_free_campus_declaration_desc: "无论身处哪所学校，每一名学生都拥有表达、结社与参与校园治理的权利。"
 BJ80_liberate_oppressed_students: "解放受压迫学生"
 BJ80_liberate_oppressed_students_desc: "自由不能停留在校门以内。北京每一所学校里的学生都是我们尚未见面的同志。"
 BJ80_beijing_campus_revolution: "进军鲁系"
 BJ80_beijing_campus_revolution_desc: "控制山东的鲁系军阀拒绝接受自由校园宣言。击败他们将为共和国带来人口、工业和通往海洋的道路。完成国策后获得对鲁系军阀的吞并战争目标。"
 BJ80_new_beijing_republic: "新北京共和国"
 BJ80_new_beijing_republic_desc: "不同校园的代表将在新的议会中平等就座。一个由青年建立的新北京已经诞生。"
 BJ80_national_student_liberation_committee: "全国学生解放委员会"
 BJ80_national_student_liberation_committee_desc: "我们将训练干部、印刷刊物、输送装备，把北京的火种送往全国。"
 BJ80_north_china_education_revolution: "华北教育革命"
 BJ80_north_china_education_revolution_desc: "天津、河北与更远方的学生正在等待信号。华北将成为革命的第二个中心。"
 BJ80_liberate_north_china_campuses: "解放华北校园"
 BJ80_liberate_north_china_campuses_desc: "旧秩序在学生军面前崩塌。现在必须把战争中的联盟建设为长久的共和国。"
 BJ80_call_to_the_nation: "向全国发出号召"
 BJ80_call_to_the_nation_desc: "青年们，组织起来！没有任何围墙能够永远隔绝自由。"
 BJ80_free_campus_alliance: "建立自由校园联盟"
 BJ80_free_campus_alliance_desc: "各学生共和国将共同研究、共同防御，并对任何侵略作出一致回应。"
 BJ80_republic_of_youth: "青年的共和国"
 BJ80_republic_of_youth_desc: "我们从一间教室起步，如今却有能力改变整个国家。历史已经把答案交给青年。"

 BJ80_autonomy_consensus_1: "自治共识：全面危机"
 BJ80_autonomy_consensus_1_desc: "争吵已经变为公开对抗，学生代表制度濒临崩溃。"
 BJ80_autonomy_consensus_2: "自治共识：政治极化"
 BJ80_autonomy_consensus_2_desc: "校园各派越来越不愿意听取彼此的意见。"
 BJ80_autonomy_consensus_3: "自治共识：争论不休"
 BJ80_autonomy_consensus_3_desc: "共和国仍在运转，但任何决定都会引发漫长争论。"
 BJ80_autonomy_consensus_4: "自治共识：秩序良好"
 BJ80_autonomy_consensus_4_desc: "学生普遍相信自治制度能够代表他们的利益。"
 BJ80_autonomy_consensus_5: "自治共识：万众一心"
 BJ80_autonomy_consensus_5_desc: "自由讨论没有削弱共和国，反而使所有人更坚定地站在一起。"
