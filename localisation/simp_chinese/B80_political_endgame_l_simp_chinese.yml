l_simp_chinese:
 B80_endgame_national_education_assembly: "召开全国教育代表大会"
 B80_endgame_national_education_assembly_desc: "民主校园已经站稳脚跟。来自各省的教师、学生与地方代表将共同讨论一个新中国的宪制基础。"
 B80_endgame_allied_war_materials_board: "同盟国战争物资委员会"
 B80_endgame_allied_war_materials_board_desc: "把海外援助纳入统一预算，以有限但稳定的物资流支撑即将到来的统一战争。"
 B80_endgame_federal_campus_convention: "联邦校园制宪会议"
 B80_endgame_federal_campus_convention_desc: "各地校园可以保留自治传统，但必须服从一部共同宪法。"
 B80_endgame_allied_intelligence_board: "盟国联合情报委员会"
 B80_endgame_allied_intelligence_board_desc: "英美情报人员将与国际部共同整理东亚战场的密码、交通和政治网络。"
 B80_endgame_democratic_liberation_charter: "民主解放宪章"
 B80_endgame_democratic_liberation_charter_desc: "统一不能只意味着换一面旗帜。拒绝代议制度的政权必须面对共和国的最后通牒。"
 B80_endgame_republics_in_education_federation: "教育共和国联邦"
 B80_endgame_republics_in_education_federation_desc: "地方学生共和国将在国防、科研和外交上组成联邦，同时保留各自的校园议会。"
 B80_endgame_pacific_air_bridge: "太平洋空中桥梁"
 B80_endgame_pacific_air_bridge_desc: "海外战机、零件和教官将通过新的航线持续抵达北京。"
 B80_endgame_republic_of_educated_citizens: "受教育公民的共和国"
 B80_endgame_republic_of_educated_citizens_desc: "国家不应制造顺从者，而应培养能够判断、选择并保卫自由的公民。"

 B80_endgame_national_examination_government: "全国考试政府"
 B80_endgame_national_examination_government_desc: "国家职位、地方预算和干部晋升都将接受统一考核，行政能力成为唯一通行证。"
 B80_endgame_national_inspectorate: "全国教育监察署"
 B80_endgame_national_inspectorate_desc: "一支直接向中央负责的监察队伍将巡视地方学校、工厂与军营。"
 B80_endgame_exam_state_industrial_plan: "考试国家工业计划"
 B80_endgame_exam_state_industrial_plan_desc: "工业投资将根据统一指标分配，落后的单位必须解释每一项偏差。"
 B80_endgame_national_student_registry: "全国学籍与动员名册"
 B80_endgame_national_student_registry_desc: "每一名适龄青年都将被登记、分类，并在国家需要时接受训练。"
 B80_endgame_administrative_integration_orders: "发布行政整合令"
 B80_endgame_administrative_integration_orders_desc: "地方政权可以交出档案与印章，或者由学生军替他们完成交接。"
 B80_endgame_standardized_provincial_academies: "标准化省级学院"
 B80_endgame_standardized_provincial_academies_desc: "统一课程、统一师资认证与统一考试将把地方精英吸纳进中央体系。"
 B80_endgame_national_command_college: "国家指挥学院"
 B80_endgame_national_command_college_desc: "行政人员必须理解战争，军官也必须学会管理一个现代国家。"
 B80_endgame_one_nation_one_timetable: "一国一张课程表"
 B80_endgame_one_nation_one_timetable_desc: "从边疆小学到中央机关，全国将在同一套纪律与时间表下运行。"

 B80_endgame_second_all_student_congress: "第二次全体学生大会"
 B80_endgame_second_all_student_congress_desc: "革命已经越过校园围墙，大会必须决定如何组织更广阔的群众与战场。"
 B80_endgame_armed_study_societies: "武装学习小组"
 B80_endgame_armed_study_societies_desc: "白天学习技术，夜间训练射击，基层组织本身就是共和国的防线。"
 B80_endgame_commune_industrial_brigades: "公社工业突击队"
