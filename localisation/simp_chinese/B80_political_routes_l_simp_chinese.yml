 B80_commune_independent_revolution: "独立学生革命"
 B80_commune_independent_revolution_desc: "不受外部政党支配的路线提升了政治自主性。"
 B80_commune_peoples_arsenal: "人民兵工厂"
 B80_commune_peoples_arsenal_desc: "由集体管理的兵工体系正在扩大生产。"
 B80_commune_mass_education: "大众技术教育"
 B80_commune_mass_education_desc: "扫盲与技术培训同时扩大了科研和人力基础。"
 B80_commune_youth_vanguard: "青年先锋队"
 B80_commune_youth_vanguard_desc: "受过训练的青年骨干提高了动员与军队组织能力。"
 B80_commune_export_revolution: "输出校园革命"
 B80_commune_export_revolution_desc: "宣传与地下组织为向外扩张革命创造了条件。"
