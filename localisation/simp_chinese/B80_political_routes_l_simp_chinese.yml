 B80_political.10.d: "八十中请求我们承认其民主事业，并为华北的自由教育提供支持。"
 B80_political.10.a: "给予政治承认与保障"
 B80_political.10.b: "援助可以，但不作承诺"
 B80_political.10.c: "这不过是另一股地方势力"
 B80_political.20.t: "八十中的行政接管要求"
 B80_political.20.d: "八十中宣称我们的政府已经无法维持教育与社会秩序，要求接受其行政体系。"
 B80_political.20.a: "接受直接整合"
 B80_political.20.b: "保留名义自治"
 B80_political.20.c: "拒绝这份最后通牒"
