l_simp_chinese:
 B80_allied_public_broadcast: "向民主世界广播"
 B80_allied_public_broadcast_desc: "八十中将公开承诺维护代议制度与校园自由，以此证明我们值得民主国家援助。"
 B80_british_campus_mission: "英国校园援华团"
 B80_british_campus_mission_desc: "英国愿意派遣教育与工程代表团，在北京建设一座抵抗侵略的民主堡垒。"
 B80_american_educational_foundation: "美国教育基金会"
 B80_american_educational_foundation_desc: "美国基金会的经费与实验器材将帮助我们把国际合作变成真正的办学能力。"
 B80_french_cultural_delegation: "法国文化代表团"
 B80_french_cultural_delegation_desc: "法国的文化与公民教育经验能为八十中的民主制度增添温度。"
 B80_allied_industrial_credit: "同盟国工业信贷"
 B80_allied_industrial_credit_desc: "凭借民主国家提供的长期信贷，我们可以在地图之外建立稳定的工业供应链。"
 B80_commonwealth_officer_exchange: "英联邦军官交流"
 B80_commonwealth_officer_exchange_desc: "训练有素的英联邦军官将帮助学生武装掌握现代战争的组织方法。"
 B80_open_the_international_department: "扩建国际部"
 B80_open_the_international_department_desc: "国际部将成为连接世界大学、科研机构和八十中课堂的常设窗口。"
 B80_democratic_campus_constitution: "校园民主宪章"
 B80_democratic_campus_constitution_desc: "学生、教师和行政人员必须共同决定共和国的权力边界。"
 B80_join_the_allies: "加入同盟国"
 B80_join_the_allies_desc: "面对日本威胁，加入英国领导的同盟是最可靠的安全选择。"
 B80_found_the_education_league: "建立教育国家联盟"
 B80_found_the_education_league_desc: "我们不必依附任何大国，也能建立一个捍卫教育与民主的独立联盟。"
 B80_appeal_to_chinese_democrats: "号召中国民主派"
 B80_appeal_to_chinese_democrats_desc: "我们将向中国各地的师生与民主人士发出公开呼吁。"
 B80_arsenal_of_democracy: "民主兵工厂"
 B80_arsenal_of_democracy_desc: "自由不会自己保护自己；我们的工厂必须成为民主世界在华北的兵工厂。"
 B80_allied_air_liaison: "盟军航空联络处"
 B80_allied_air_liaison_desc: "盟军教官与战机将为北京上空提供第一道现代化防线。"
 B80_defend_north_china_democracy: "保卫华北民主"
 B80_defend_north_china_democracy_desc: "华北不能永远处在军阀与侵略者的阴影下。"
 B80_allied_china_command: "盟军中国校园司令部"
 B80_allied_china_command_desc: "统一联络、情报与作战计划，才能把援助转化为战场优势。"
 B80_beacon_of_eastern_democracy: "东方民主灯塔"
 B80_beacon_of_eastern_democracy_desc: "从北京校园发出的光，将证明民主制度同样能够在东方赢得战争。"

 B80_discipline_code: "颁布校园纪律令"
 B80_discipline_code_desc: "混乱必须结束。教育处将以统一纪律重新组织校园生活。"
 B80_empower_grade_directors: "赋权年级主任"
 B80_empower_grade_directors_desc: "最了解学生与教师的年级主任，应成为行政体系的骨干。"
 B80_standardize_daily_schedule: "统一全校作息"
 B80_standardize_daily_schedule_desc: "从早操到熄灯，每一分钟都必须服务于秩序和效率。"
 B80_restore_examination_authority: "恢复考试权威"
 B80_restore_examination_authority_desc: "明确且统一的评价标准，是教育处统治正当性的基础。"
 B80_campus_inspection_corps: "校园督察队"
 B80_campus_inspection_corps_desc: "督察队将检查命令落实情况，并处理威胁教学秩序的秘密活动。"
 B80_quantified_campus_management: "量化校园管理"
 B80_quantified_campus_management_desc: "可以统计的工作才能改进，可以排名的单位才会竞争。"
 B80_selective_merit_program: "精英选拔计划"
 B80_selective_merit_program_desc: "有限的资源应集中在最有潜力的学生与科研项目上。"
 B80_education_department_takes_command: "教育处接管全局"
 B80_education_department_takes_command_desc: "临时措施即将成为永久制度，教育处将正式承担国家权力。"
 B80_professional_civil_service: "专业化校务官僚"
 B80_professional_civil_service_desc: "稳定的国家不能依靠临时委员会，必须建立职业化行政队伍。"
 B80_centralized_budget_office: "集中预算办公室"
 B80_centralized_budget_office_desc: "每一笔经费都应服从统一规划，避免重复建设和无效开支。"
 B80_school_security_bureau: "校务安全局"
 B80_school_security_bureau_desc: "安全局将把情报、保卫与反间谍工作集中到同一套指挥系统。"
 B80_expand_model_school_system: "推广示范学校体系"
 B80_expand_model_school_system_desc: "八十中的制度可以成为华北学校统一管理的新标准。"
 B80_administrative_mobilization: "行政动员"
 B80_administrative_mobilization_desc: "表格、名单与配给制度也能成为总体战中强大的武器。"
 B80_continuity_of_command: "确保政令连续"
 B80_continuity_of_command_desc: "无论外界发生什么，校园各级机构都必须继续运转。"
 B80_demand_north_china_compliance: "要求华北服从"
 B80_demand_north_china_compliance_desc: "那些无法维持教育和社会秩序的政权，应接受八十中行政体系的接管。"
 B80_efficient_authoritarian_state: "高效行政国家"
 B80_efficient_authoritarian_state_desc: "权力集中并非目的，它是快速建设与执行政策的手段。"
 B80_education_governs_the_nation: "以教育治理国家"
 B80_education_governs_the_nation_desc: "从一所学校到一个国家，纪律、考试与行政体系将塑造整个社会。"

 B80_all_student_congress: "召开全体学生大会"
 B80_all_student_congress_desc: "紧急委员会必须向全体学生负责，所有权力来自学生集体。"
 B80_class_committee_network: "班级委员会网络"
 B80_class_committee_network_desc: "每个班级都是最基层的权力单位，也是动员与监督的核心。"
 B80_collectivize_the_canteen: "食堂集体化"
 B80_collectivize_the_canteen_desc: "首先保证所有人都能吃饱，再讨论旧制度所谓的效率。"
 B80_red_education_groups: "红色学习小组"
 B80_red_education_groups_desc: "学习小组将政治教育、科学知识与社会调查结合起来。"
 B80_student_picketers: "组织学生纠察队"
 B80_student_picketers_desc: "学生纠察队将保卫大会、仓库与街道，阻止反动势力破坏革命。"
 B80_workers_students_workshops: "工学合作社"
 B80_workers_students_workshops_desc: "学生与工人共同管理生产，将课堂知识直接用于制造。"
 B80_invite_underground_educators: "邀请地下教育工作者"
