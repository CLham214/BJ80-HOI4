 B80_allied_security_mission: "盟军安全顾问团"
 B80_allied_security_mission_desc: "盟军顾问帮助我们改进防御规划和指挥制度。"
 B80_allied_chinese_democratic_front: "中国民主教育阵线"
 B80_allied_chinese_democratic_front_desc: "各地民主人士和教育工作者正围绕八十中形成统一阵线。"
 B80_allied_arsenal_of_democracy: "民主兵工厂"
 B80_allied_arsenal_of_democracy_desc: "高效生产正在为民主阵营提供源源不断的装备。"
 B80_allied_china_command_idea: "盟军中国校园司令部"
