 B80_contact_the_ccp_desc: "中国共产党拥有丰富的组织经验与群众基础，与他们合作能加速革命。"
 B80_independent_student_revolution: "独立的学生革命"
 B80_independent_student_revolution_desc: "学生运动不应成为任何外部政党的附属品，我们将走自己的道路。"
