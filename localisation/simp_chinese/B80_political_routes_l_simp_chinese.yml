 B80_commune_all_power_to_students: "一切权力归学生"
 B80_commune_all_power_to_students_desc: "学生代表制度已经成为覆盖国家的权力体系。"

 B80_political.1.t: "校园民主宪章大会"
 B80_political.1.d: "各方都承认民主制度，但对新宪章首先应保护什么仍有分歧。"
 B80_political.1.a: "首先保障公民权利"
 B80_political.1.b: "自由必须拥有武力保护"
 B80_political.1.c: "让福利使民主深入人心"
 B80_political.2.t: "教育处接管全局"
 B80_political.2.d: "秩序已经恢复。现在必须决定行政体系未来最重视的目标。"
 B80_political.2.a: "稳固行政权威"
 B80_political.2.b: "让专家和教师主导"
 B80_political.2.c: "建设能力决定一切"
 B80_political.3.t: "学生公社的第一次大会"
 B80_political.3.d: "学生们挤满会场，为公社接下来的方向展开激烈辩论。"
 B80_political.3.a: "巩固代表大会制度"
 B80_political.3.b: "优先武装革命"
 B80_political.3.c: "立即推进生产集体化"
