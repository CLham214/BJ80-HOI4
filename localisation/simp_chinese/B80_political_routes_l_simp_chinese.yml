 B80_peoples_arsenal_desc: "武器生产将由集体监督，并首先供应保卫革命的人民武装。"
 B80_literacy_and_technical_campaign: "扫盲与技术运动"
 B80_literacy_and_technical_campaign_desc: "让知识走出重点班与实验室，成为所有劳动者都能掌握的力量。"
 B80_youth_vanguard: "青年先锋队"
 B80_youth_vanguard_desc: "最有组织力的青年将承担最危险的任务，并带动更多群众参战。"
