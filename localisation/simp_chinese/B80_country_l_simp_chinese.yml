 B80_pragmatic_education_helmsman: "务实的教育掌舵者"
 B80_pragmatic_education_helmsman_desc: "任炜东善于在教育理想、校园秩序与现实资源之间寻找可行道路。"
 B80_grade_director: "年级统筹者"
 B80_grade_director_desc: "罗静卿对年级事务的熟悉，使庞杂的校园行政能够迅速运转。"
 B80_mathematical_rigor: "数学的严谨"
 B80_mathematical_rigor_desc: "李丁强调清晰、严密而可验证的思考方式，这种训练正在影响共和国的研究与生产。"
 B80_physics_experimentalist: "物理实验精神"
 B80_physics_experimentalist_desc: "梁吉峰倡导从实验中检验理论，并把物理知识转化为现实生产能力。"
 B80_student_autonomy_convener: "自治议会召集人"
 B80_student_autonomy_convener_desc: "刘易达擅长把嘈杂的学生意见转化为可执行的共同决议。"
 B80_international_campus_statesman: "国际校园政治家"
 B80_international_campus_statesman_desc: "吴文琦以国际交流与校园宪政为支点，为八十中争取外部承认。"
 B80_education_department_director: "教育处掌舵者"
 B80_education_department_director_desc: "罗静卿将年级管理经验扩展为一套稳定、高效而严格的行政体系。"
 B80_student_commune_organizer: "学生公社组织者"
 B80_student_commune_organizer_desc: "史嘉奥既能主持学生大会，也善于把群众热情转化为生产与动员能力。"

 VICTORY_POINTS_9843: "北京市第八十中学"

 B80_eighty_education_legacy: "八十中教育遗产"
 B80_eighty_education_legacy_desc: "优秀学生是这个国家最宝贵的资源。深厚的教育传统赋予了我们远超国土规模的科研潜力，但也让本就稀少的人力更加珍贵。"
 B80_gaokao_pressure: "高考压力"
 B80_gaokao_pressure_desc: "所有资源都向升学与考试倾斜。高压环境催生了惊人的学习效率，却挤压了正常生产。"
 B80_campus_autonomy_tradition: "校园自治传统"
 B80_campus_autonomy_tradition_desc: "班级、社团和学生组织长期承担着校园公共事务，为真正的学生自治奠定了基础。"
 B80_legacy_education_deal_opinion: "八十中教育合作协议"
 B80_protagonist_campus: "天选校园"
 B80_protagonist_campus_desc: "既然这是属于八十中的故事，我们就没有必要假装自己只是一个普通的五千人口小国。源源不断的毕业生、远超常理的生产力和惊人的战斗意志，将帮助玩家轻松推动这场校园革命。"

 BJ80_student_guard_template: "学生警卫队"
 BJ80_campus_guard: "八十中校园警卫队"
