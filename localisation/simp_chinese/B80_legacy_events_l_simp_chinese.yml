 B80_legacy_aviation_society: "八十中航空社"
 B80_legacy_campus_fleet: "校园舰队传统"
 B80_legacy_academic_network: "王选创新人才网络"
 B80_legacy_academic_network_desc: "以王选创新实验班为中心，优秀学生得以跨越学科界限共同攻关。"
 B80_anti_japanese_hegemony: "反向压制日本"
 B80_legacy_orderly_teaching: "井然有序的教学"
 B80_legacy_orderly_teaching_desc: "稳定的课堂秩序让学生与行政系统都能高效运转。"
 B80_legacy_japanese_higher_education: "日本高校制度"
 B80_legacy_japanese_higher_education_desc: "我们有选择地吸收日本高校的教学与科研组织经验。"
 B80_legacy_japanese_espionage_methods: "日本式谍报术"
 B80_legacy_japanese_espionage_methods_desc: "经过日本式训练的特工更擅长建立情报网、窃取蓝图与防范渗透。"
 B80_legacy_japanese_manufacturers: "日本军工承包商"
 B80_legacy_japanese_manufacturers_desc: "海外制造商带来了成熟的生产管理经验。"
 B80_legacy_student_welfare: "学生生活保障体系"
 B80_legacy_student_welfare_desc: "更好的膳食和校园生活能够换来持久的社会凝聚力。"
 B80_legacy_imperial_armed_forces: "八十帝国军"
 B80_legacy_imperial_armed_forces_desc: "一支经过统一整编的武装力量已经形成。"
 B80_legacy_physical_education: "竞时体育传统"
 B80_legacy_physical_education_desc: "体育训练改善了兵员体质，也缩短了基础训练时间。"
 B80_legacy_school_canteen_logistics: "校园食堂后勤网"
 B80_legacy_school_canteen_logistics_desc: "食堂不只管饭，也成为学生军可靠的后勤中枢。"
 B80_legacy_campus_democracy: "学生是校园的主人"
 B80_legacy_campus_democracy_desc: "学生代表真正参与治理，为共和国带来新的政治活力。"
 B80_legacy_construction_corps: "专业化校园工程队"
 B80_legacy_construction_corps_desc: "标准化流程与专业施工队显著加快了校园建设。"
 B80_legacy_trade_committee: "校园贸易委员会"
 B80_legacy_trade_committee_desc: "统一的贸易窗口把海外订单与校园产业连接起来。"
 B80_legacy_permanent_neutrality: "永久中立校园"
 B80_legacy_permanent_neutrality_desc: "我们承诺不主动卷入战争，以换取一个稳定的发展环境。"
 B80_legacy_modern_industry: "现代化生产体系"
 B80_legacy_modern_industry_desc: "标准化、专业化与现代管理共同提高了校园工业的效率。"
 B80_legacy_integrated_japanese_education: "全面引进日本高校制度"
 B80_legacy_integrated_japanese_education_desc: "日本高校制度已经被系统性地融入八十中的教学和科研组织。"
 B80_legacy_modern_army: "现代化八十陆军"
 B80_legacy_modern_army_desc: "八十陆军已经从临时武装成长为组织严密的现代军队。"
 B80_legacy_aerospace_industry: "八十航空产业链"
 B80_legacy_aerospace_industry_desc: "从零部件到总装，航空生产已经形成完整体系。"
 B80_legacy_elite_flight_training: "高效化飞行训练"
 B80_legacy_elite_flight_training_desc: "标准化课程降低了训练事故，并提高了飞行员的战斗效率。"
 B80_legacy_tianjin_sailors: "天津水手团"
 B80_legacy_tianjin_sailors_desc: "熟悉水性的天津学生成为了校园舰队最可靠的骨干。"
 B80_legacy_standardized_production: "标准化生产流程"
 B80_legacy_standardized_production_desc: "统一的零件和工艺标准显著提高了生产效率。"
 B80_legacy_expanded_trade_network: "校园对外贸易网"
 B80_legacy_expanded_trade_network_desc: "贸易委员会已经把最初的窗口扩展成覆盖多个国家的商业网络。"
 B80_legacy_construction_mobilization: "校园建设总动员"
 B80_legacy_construction_mobilization_desc: "师生和专业工程队共同投入校园扩建，建设速度达到前所未有的水平。"
 B80_legacy_global_academic_exchange: "全球学术交流"
 B80_legacy_global_academic_exchange_desc: "八十中已经成为国际学术网络中不可忽视的一环。"
 B80_legacy_international_intelligence_network: "国际科研情报网"
 B80_legacy_international_intelligence_network_desc: "科研交流与秘密情报渠道共同构成了覆盖全球的技术信息网络。"
 B80_legacy_education_department_order: "教育处的制度化秩序"
 B80_legacy_education_department_order_desc: "教育处把临时性的课堂整顿写入常设制度，稳定的教学秩序也降低了行政与生活成本。"
 B80_legacy_japanese_patronage: "日本方面的政治庇护"
 B80_legacy_japanese_patronage_desc: "作为一名“忠诚”的下属，我们能够利用日本方面的关系获得建设合同、优惠贸易与民用投资。"
 B80_legacy_japanese_arms_contracts: "日本军工承包合同"
 B80_legacy_japanese_arms_contracts_desc: "日本军工企业带来的订单和工程师将直接改善八十中军工生产线的效率。"
 B80_legacy_japanese_industrial_consortium: "中日校园工业联合体"
 B80_legacy_japanese_industrial_consortium_desc: "分散的军工承包商被整合进统一联合体，八十中的军工生产能力由此迈上新的台阶。"
 B80_legacy_wang_shouguan_science_system: "王绶琯科学创新体系"
 B80_legacy_wang_shouguan_science_system_desc: "科学创新实验班、竞赛项目和校内实验室被联结成一套稳定运转的科研培养体系。"
 B80_legacy_american_education_model: "美式校园教育模式"
 B80_legacy_american_education_model_desc: "开放课堂、学生社团与灵活课程带来了科研活力，也提升了校园治理的参与度。"
 B80_legacy_model_educators: "教育工作者的榜样"
 B80_legacy_model_educators_desc: "优秀教师既是课堂中的引路人，也是校园政治与科研事业可信赖的榜样。"
 B80_legacy_expanded_aviation_society: "扩编后的八十中航空社"
 B80_legacy_expanded_aviation_society_desc: "扩建的场地、统一的训练课程和更多骨干成员，使航空社成为真正的飞行人才基地。"
 B80_legacy_comprehensive_student_welfare: "全方位学生生活保障"
 B80_legacy_comprehensive_student_welfare_desc: "从餐饮、住宿到医疗和文体活动，完整的学生保障体系正在巩固校园凝聚力。"
 B80_legacy_international_research_partnerships: "国际科研伙伴关系"
 B80_legacy_international_research_partnerships_desc: "稳定的联合实验室与交换项目，让国际科研合作从临时交流转变为长期伙伴关系。"
 B80_legacy_education_diplomacy_network: "教育外交网络"
 B80_legacy_education_diplomacy_network_desc: "学校、大学与教育机构之间的联系被转化为一张能够影响国际舆论与贸易的外交网络。"
 B80_legacy_campus_democracy_2: "制度化学生自治"
 B80_legacy_campus_democracy_2_desc: "学生代表大会、常设委员会与公开问责制度，让学生自治不再依赖一时的政治热情。"
 B80_legacy_cavalry_tank_group: "黎瑞成骑兵坦克集群"
 B80_legacy_cavalry_tank_group_desc: "坦克将与高速骑兵编成机动集群，以迅速穿插和连续推进瓦解敌军防线。"
 B80_legacy_infantry_tank_coordination: "李维思步坦协同体系"
 B80_legacy_infantry_tank_coordination_desc: "步兵负责稳固战线与引导火力，装甲部队则在周密计划下突破敌军关键支点。"
 B80_legacy_hakimi_medium_tank_program: "“哈基米号”中型坦克计划"
 B80_legacy_hakimi_medium_tank_program_desc: "均衡的火力与机动性能使“哈基米号”成为适合快速进攻的校园装甲主力。"
 B80_legacy_doraemon_heavy_tank_program: "“哆啦B梦号”重型坦克计划"
 B80_legacy_doraemon_heavy_tank_program_desc: "厚重装甲与可靠防护让“哆啦B梦号”能够顶住最猛烈的反击并稳步推进。"
 B80_legacy_multirole_air_tactics: "张梓涵多用途战机战术"
 B80_legacy_multirole_air_tactics_desc: "灵活切换任务的战斗机群可以扩大作战半径，并在争夺制空权时保持稳定效率。"
 B80_legacy_strategic_bombing_tactics: "黄振宇战略轰炸战术"
 B80_legacy_strategic_bombing_tactics_desc: "远程轰炸机将以精确航法和严密编队深入敌后，持续破坏敌人的战争工业。"
 B80_legacy_rapid_air_assault: "史嘉奥快速突击战术"
 B80_legacy_rapid_air_assault_desc: "运输机、伞兵与近距支援航空兵协同突击，在敌方完成反应前夺取机场和关键节点。"
 B80_legacy_big_gun_fleet: "大舰巨炮舰队"
 B80_legacy_big_gun_fleet_desc: "以主力舰装甲与重炮构成海战核心，用正面决战夺取海上支配权。"
 B80_legacy_submarine_blade: "海底之刃"
 B80_legacy_submarine_blade_desc: "隐蔽的潜艇部队将避开敌军主力，袭击运输线并以鱼雷削弱更强大的舰队。"
 B80_legacy_naval_aviation: "海阔天空"
 B80_legacy_naval_aviation_desc: "舰载航空兵把舰队火力延伸到地平线之外，使航母与舰载机能够协同发动致命打击。"
 B80_legacy_aircraft_manufacturing_center: "八十飞机制造中心"
 B80_legacy_aircraft_manufacturing_center_desc: "围绕航空生产建立的专业制造中心，既能提升生产线爬坡速度，也能为前线飞行部队提供可靠保障。"
 B80_legacy_defense_industrial_base: "校园国防工业基地"
 B80_legacy_defense_industrial_base_desc: "集中建设的军工基地拥有成熟生产线和稳定供应体系，足以支撑长期战争动员。"
 B80_legacy_french_civic_education: "法式公民教育"
 B80_legacy_french_civic_education_desc: "公民课程强调共和责任、公共参与与理性辩论，为校园民主提供了更稳定的社会基础。"
 B80_legacy.1.t: "晨光诗会的回响"
 B80_legacy.1.d: "诗会吸引了全校师生。有人希望把它办成文化节，也有人认为应借此鼓舞战时士气。"
 B80_legacy.1.a: "让诗歌照亮校园"
 B80_legacy.1.b: "让诗歌成为战歌"
 B80_legacy.2.t: "校园歌手大赛"
 B80_legacy.2.d: "礼堂座无虚席。大赛既能凝聚学生，也吸引了校外赞助者。"
 B80_legacy.2.a: "面向全体学生免费开放"
 B80_legacy.2.b: "接受赞助，扩建校园产业"
 B80_legacy.3.t: "新校服方案"
 B80_legacy.3.d: "学生代表提交了两套方案：舒适而富有个性的日常款，或便于训练和动员的实用款。"
 B80_legacy.3.a: "学生喜欢才是第一位"
 B80_legacy.3.b: "采用便于动员的实用款"
 B80_legacy.4.t: "国际化的道路"
 B80_legacy.4.d: "海外伙伴愿意提供学术资源，企业代表则提出了联合建设实验工厂的计划。"
 B80_legacy.4.a: "优先建立学术网络"
 B80_legacy.4.b: "优先引进产业投资"
 B80_legacy.5.t: "维新思潮的方向"
 B80_legacy.5.d: "扩张带来的震荡迫使学校重新思考治理方式。学生代表要求真正参与政治，教育处则强调首先恢复秩序。"
 B80_legacy.5.a: "把权力交给学生代表"
 B80_legacy.5.b: "由教育处维持秩序"
 B80_legacy.6.t: "新学期的第一项议程"
 B80_legacy.6.d: "任炜东在开学大会上宣布，学校有能力集中资源办成一件大事。问题只是，这件大事应当是什么？"
 B80_legacy.6.a: "设立跨学科研究基金"
 B80_legacy.6.b: "扩建教学与生活设施"
 B80_legacy.6.c: "强化校园安全体系"
 B80_legacy.7.t: "又一个五年……吗？"
 B80_legacy.7.d: "表面的繁荣掩盖不了国际局势的阴影。有人主张继续发展，也有人要求立即为无法避免的战争做好准备。"
 B80_legacy.7.a: "繁荣本身就是最好的保障"
 B80_legacy.7.b: "风暴将至，扩充兵工厂"
 B80_legacy.8.t: "从碧蓝档案到真正的舰队"
 B80_legacy.8.d: "海军社成员对舰队编成和战术术语如数家珍。现在必须决定，是让他们进入参谋部，还是先把资源投入真正的船坞。"
 B80_legacy.8.a: "纸上经验也能指导舰队"
 B80_legacy.8.b: "先造出能下水的船再说"
 B80_legacy.10.t: "欧洲教育考察团归来"
 B80_legacy.10.d: "考察团带回了三套各有侧重的方案：英国的导师制、法国的公民教育，以及德国的技术教育体系。"
 B80_legacy.10.a: "采用英国导师制"
 B80_legacy.10.b: "采用法国公民教育"
 B80_legacy.10.c: "采用德国技术教育"
