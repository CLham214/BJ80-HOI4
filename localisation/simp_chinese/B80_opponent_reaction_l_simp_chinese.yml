l_simp_chinese:
 B80_opponent_reaction_category: "八十崛起：国际反应"
 B80_opponent_reaction_category_desc: "八十中的校门已经成了华北地图上的一道国境线。每一次扩张、演习与外交表态，都会迫使地方势力和大国重新计算风险；他们可能承认我们、提出条件、援助我们的敌人，或者亲自组织遏制。\n\n£world_tension_icon  国际警觉：§Y[?ROOT.B80_expansion_alarm|Y0]§!/100\n£pol_power  外交胜利：§G[?ROOT.B80_diplomatic_victories|Y0]§!\n\n警觉越高，外国反应越强。校誉、政治路线与此前的外交表现将决定谈判空间；真正的战争则会让所有承诺接受检验。"
 B80_expansion_alarm_tt: "§Y国际警觉§!反映各国对八十中扩张的戒备。跨越关键刻度会依次引来观察、照会、制裁、遏制会议与最后通牒。"
 B80_diplomatic_victories_tt: "§Y外交胜利§!来自和平化解重大危机；积累足够胜利可争取正式国际承认。"

 B80_hold_press_conference: "召开望京记者会"
 B80_hold_press_conference_desc: "让国际记者亲眼看见课堂、社团和议事会，而不是只从军用地图上认识八十中。透明本身就是一种外交资源。"
 B80_hold_press_conference_tt: "消耗政治点，以公开说明§G降低国际警觉§!；和平时期的说服力更强。"
 B80_backchannel_diplomacy: "启动教师秘密联络线"
 B80_backchannel_diplomacy_desc: "大学同窗、竞赛教练和教研同行构成了一张不写在外交名册上的网络。正式照会碰壁时，一通电话往往还能留下余地。"
 B80_backchannel_diplomacy_tt: "消耗政治点与§Y学校声望§!，显著降低警觉，并改善与主要遏制国的关系。"
 B80_stage_campus_exercise: "举行校园防卫演习"
 B80_stage_campus_exercise_desc: "操场、教学楼和食堂通道将按战时标准接受检验。邻国当然会称之为挑衅，但准备充分总比措手不及好。"
 B80_stage_campus_exercise_tt: "§R提高国际警觉§!，换取陆军经验、战争支持与危机中的临时战备优势。"
 B80_submit_eighty_report: "向世界提交“八十中答卷”"
 B80_submit_eighty_report_desc: "成绩、社团、科研与公开治理将被整理成一份无法轻易驳回的答卷。我们要证明八十中不是临时占据校园的武装，而是有能力承担秩序的国家。"
 B80_submit_eighty_report_tt: "以很高的§Y学校声望§!和稳定的校园表现换取全面降温、解除制裁，并取得一次§G外交胜利§!。"
 B80_public_student_referendum: "举行公开学生公投"
 B80_public_student_referendum_desc: "让记者、观察员和邻国代表全程见证投票。若学生自治确实拥有多数支持，外国便很难继续把它说成一次秘密夺权。"
 B80_public_student_referendum_tt: "学生自治路线可一局一次用公开公投化解当前危机，大幅降低警觉并取得一次§G外交胜利§!。"
 B80_last_minute_compromise: "作出最后一刻的妥协"
 B80_last_minute_compromise_desc: "在倒计时归零前接受边界冻结与有限核查。它并不体面，但能把已经装上火车的军队暂时送回营房。"
 B80_last_minute_compromise_tt: "结束当前遏制危机并避免战争，代价是暂时接受§Y边界冻结与核查§!。"
 B80_seek_patron_support: "请求路线赞助国介入"
 B80_seek_patron_support_desc: "民主世界、革命同道或日本关系网都可能替我们压住危机；大国的援手从来附带期待，却能在关键时刻改变力量对比。"
 B80_seek_patron_support_tt: "根据当前政治路线请求赞助国调停或军援；成功可缓和危机并获得§Y战时外国援助§!。"
 B80_preempt_containment: "先发制人打破遏制"
 B80_preempt_containment_desc: "既然对方已经把会议纪要写成了作战计划，我们就没有义务等他们选好日期。以一次迅速行动击碎尚未合拢的包围圈。"
 B80_preempt_containment_tt: "主动结束外交倒计时，取得对遏制领导国的战争理由，并获得短期进攻准备。§R这将把危机直接推向战争。§!"
 B80_opponent_recognition_cost_tt: "这项行动会消耗§Y学校声望§!；学校声望不足时无法选择。"
 B80_opponent_alarm_reduction_tt: "降低§Y国际警觉§!只会延缓尚未发生的升级；已经形成的外国政策不会自动倒转，必须通过外交胜利或国际承认解决。"
 B80_appeal_to_china: "向中国方面递交教育照会"
 B80_appeal_to_china_desc: "强调八十中的中国教育传统与维护华北秩序的能力，争取让国民政府把我们视为可以谈判的政治实体。"
 B80_appeal_to_china_tt: "向§Y中华民国§!主动示好，改善关系并小幅降低警觉；若对方仍存在，其态度会影响后续危机。"
 B80_appeal_to_japan: "向日本方面递交教育照会"
 B80_appeal_to_japan_desc: "东京关心的未必是我们的课程表，却一定关心华北的力量平衡。给它一份可以回复的照会，总好过等它直接送来最后通牒。"
 B80_appeal_to_japan_tt: "向§Y日本§!主动接触，改善关系并小幅降低警觉；合作路线可得到额外外交空间。"
 B80_reduce_alarm_with_exchange: "扩大国际课程交流"
 B80_reduce_alarm_with_exchange_desc: "把交换生、公开课和联合研究变成常态。人员往来越密切，外国宣传就越难把校园描述成一座封闭军营。"
 B80_reduce_alarm_with_exchange_tt: "消耗§Y学校声望§!，降低国际警觉并强化开放校园外交。"
 B80_prepare_frontier_agents: "布置边疆学生联络员"
 B80_prepare_frontier_agents_desc: "模联社、校友会与地方学生组织可以成为观察边境的眼睛，也可以在战争爆发前替我们找到愿意开门的人。"
 B80_prepare_frontier_agents_tt: "提高情报与间谍行动能力，并为面对地方势力或遏制集团的行动做好准备；会小幅提高国际警觉。"

 B80_containment_crisis_countdown: "遏制危机倒计时"
 B80_containment_crisis_countdown_desc: "外国代表已经结束讨论，边境部队正在集结。若倒计时结束前没有达成妥协、找到赞助者或主动出击，遏制领导国就会把最后通牒变成战争计划。"
 B80_containment_crisis_countdown_tt: "任务到期时，遏制领导国将获得对八十中的战争理由并可能立即升级冲突。"

 B80_opponents.1.t: "外国观察团抵达望京"
 B80_opponents.1.d: "一队外交官、记者和教育专家走进校门。他们说要考察教学秩序，随员却不停记录仓库、操场和交通线。让他们看见什么，将成为世界判断八十中的第一份材料。"
 B80_opponents.1.a: "开放课堂，也开放账本"
 B80_opponents.1.b: "教学区可以看，防务免谈"
 B80_opponents.1.c: "请我们的赞助者负责斡旋"
 B80_opponents.2.t: "观察团提交报告"
 B80_opponents.2.d: "观察团离开望京，各国使馆已经收到报告。有人看见了一所运转有序的学校，也有人只看见一支藏在课桌后的新军队；接下来的行动会证明哪种判断占了上风。"
 B80_opponents.2.a: "至少他们亲眼看过这里"

 B80_opponents.10.t: "华北出现了一个校园政权"
 B80_opponents.10.d: "八十中已经不再是地图上可以忽略的一块颜色。它的宣传吸引学生，它的军队改变边界，它的外交人员则要求正式称呼。国民政府必须决定：承认、约束，还是在它继续成长前组织遏制。"
 B80_opponents.10.a: "承认其有限地位，换取华北稳定"
 B80_opponents.10.b: "有条件承认，并要求边界承诺"
 B80_opponents.10.c: "联络地方势力，建立遏制网"
 B80_opponents.11.t: "南京承认八十中"
 B80_opponents.11.d: "国民政府的照会使用了我们的正式国名，并同意建立常设联络渠道。承认并不等于友谊，但从今天起，对方必须把八十中当作一个能签字、也能追责的政治实体。"
 B80_opponents.11.a: "一张公文改变了地图的含义"
 B80_opponents.12.t: "来自中国方面的有条件照会"
 B80_opponents.12.d: "对方愿意承认八十中的有限地位，条件是冻结边界扩张并接受观察。我们可以换取喘息，也可以用声望重谈条款；若直接拒绝，地方势力将很快得到保证和武器。"
 B80_opponents.12.a: "接受条件，先把承认拿到手"
 B80_opponents.12.b: "用教育声望重谈边界条款"
 B80_opponents.12.c: "八十中的边界不由南京审批"
 B80_opponents.13.t: "华北遏制网正在形成"
 B80_opponents.13.d: "国民政府拒绝单独承认八十中，转而向察南、鲁系及其他地方势力提供保证。边境哨所收到新电台和武器，原本彼此提防的对手开始交换我们的部署图。"
 B80_opponents.13.a: "那就让他们在同一张地图上失败"

 B80_opponents.20.t: "东京的八十中评估"
 B80_opponents.20.d: "参谋本部、外务省和华北方面军给出了三份互相矛盾的报告：有人把八十中视为可利用的合作伙伴，有人要求把它纳入保护体系，也有人警告这所学校最终会成为日本在大陆的新敌人。"
 B80_opponents.20.a: "以合作换取其公开靠拢"
 B80_opponents.20.b: "要求其接受日本保护"
 B80_opponents.20.c: "强化满蒙防线，开始遏制"
 B80_opponents.21.t: "东京选择校园合作"
 B80_opponents.21.d: "日本代表没有带来最后通牒，而是带来了联络官、订单和一份合作清单。东京希望这些援助能把八十中牢牢拉入它的轨道；我们则可以先把资源变成自己的实力。"
 B80_opponents.21.a: "欢迎代表团——账单以后再谈"
 B80_opponents.22.t: "日本的保护要求"
 B80_opponents.22.d: "东京提出由日本保障八十中的安全，作为交换，我们必须接受外交监督与军事协调。措辞很礼貌，附件却已经替我们规定了服从的程序。"
 B80_opponents.22.a: "接受保护，保存学校"
 B80_opponents.22.b: "用既有关系改写协议"
 B80_opponents.22.c: "把附件原封不动退回东京"
 B80_opponents.23.t: "日本开始遏制八十中"
 B80_opponents.23.d: "日本顾问正在满洲与蒙疆之间协调防务，边境部队获得了新的装备和航空侦察支持。东京没有宣战，但它已经明确表示：八十中再向前一步，就会碰到日本画出的线。"
 B80_opponents.23.a: "地图上的线终究要由军队解释"

 B80_opponents.30.t: "中共中央评估八十中"
 B80_opponents.30.d: "一个由学校成长起来的政权，既可能成为青年政治的新样板，也可能只是又一支披着校服的地方武装。我们应公开声援、支援它的地方对手，还是继续观察其真正路线？"
 B80_opponents.30.a: "声援进步学生与校园自治"
 B80_opponents.30.b: "把军援交给抵抗扩张的地方力量"
 B80_opponents.30.c: "暂不下注，继续观察"
 B80_opponents.31.t: "来自革命根据地的声援"
 B80_opponents.31.d: "中共公开肯定了八十中学生参与政治与抵抗外来压力的行动，一批教员、联络员和物资也沿着不公开的路线抵达望京。声援带来力量，也让我们的立场更加醒目。"
 B80_opponents.31.a: "学生之间不需要外交辞令"
 B80_opponents.32.t: "延安的枪流向边疆"
 B80_opponents.32.d: "情报部门确认，中共没有公开与我们决裂，却把一批步枪、顾问和联络员交给了抵抗八十中扩张的地方势力。对方正在学习如何把零散守军组织成一条更难突破的防线。"
 B80_opponents.32.a: "他们已经选择了参与方式"

 B80_opponents.40.t: "国际制裁开始收紧"
 B80_opponents.40.d: "银行延迟结算，设备订单被临时审查，外国报纸开始把“八十中问题”放在同一版面。制裁还没有掐断我们的经济，却正在测试校园能承受多大压力。"
 B80_opponents.40.a: "允许观察员核验民用项目"
 B80_opponents.40.b: "发动校友与国际部反击舆论"
 B80_opponents.40.c: "靠自己的食堂、工厂和实验室撑过去"

 B80_opponents.50.t: "华北遏制会议"
 B80_opponents.50.d: "地方代表带着各自的恐惧来到会议桌前。他们不一定彼此信任，却都担心八十中的下一项国策会落到自己头上。现在需要一个国家决定，这些零散承诺是否要变成共同防务。"
 B80_opponents.50.a: "由我们领导联合遏制"
 B80_opponents.50.b: "只建立有限边境防务"
 B80_opponents.50.c: "不替地方势力承担一场战争"
 B80_opponents.51.t: "遏制集团公开成立"
 B80_opponents.51.d: "外国公报宣称，任何进一步改变华北边界的行动都将遭到共同回应。地方势力获得保证、军援与统一防务计划；他们第一次不再只问八十中何时进攻，而是开始讨论如何一起反击。"
 B80_opponents.51.a: "一群对手，正好一次解决"
 B80_opponents.52.t: "遏制会议无果而终"
 B80_opponents.52.d: "各方带着不同底线来到会场，最终也带着不同底线离开。没有国家愿意承担领导遏制八十中的代价，地方代表只得到一叠没有签字的草案。"
 B80_opponents.52.a: "他们至少还没有准备好"
 B80_opponents.53.t: "有限边境防务方案"
 B80_opponents.53.d: "会议没有形成共同保证，也没有产生一个遏制集团。主办国只同意向边疆守军提供少量武器与防御方案，并明确拒绝为地方势力自动参战。边境会更难打，但危机仍有回旋余地。"
 B80_opponents.53.a: "至少他们还没有绑在一起"

 B80_opponents.60.t: "是否向八十中发出最后通牒？"
 B80_opponents.60.d: "遏制会议已经完成军事评估。外交官认为仍可用边界冻结换取和平，军方则坚持八十中只会把每次妥协当作准备下一次扩张的时间。决定必须在部队失去耐心前作出。"
 B80_opponents.60.a: "发出最后通牒，给他们最后一次选择"
 B80_opponents.60.b: "在军事施压下发出最后通牒"
 B80_opponents.60.c: "风险太大，暂时退让"
 B80_opponents.61.t: "遏制集团的最后通牒"
 B80_opponents.61.d: "照会要求八十中冻结边界、接受核查，并停止对邻近地区的一切政治活动。期限之后，对方将不再保证和平。全校都在等一个答案。"
 B80_opponents.61.a: "冻结边界，接受临时核查"
 B80_opponents.61.b: "用校誉与政治资本购买正式承认"
 B80_opponents.61.c: "拒绝——八十中的未来没有审查员席位"
 B80_opponents.62.t: "最后通牒被收回"
 B80_opponents.62.d: "对方军方要求强硬，外交部门却最终承认：为一所学校发动一场无法预料的大战并不划算。最后通牒没有送出，边境列车也开始掉头。"
 B80_opponents.62.a: "这同样是一场胜利"

 B80_opponents.80.t: "地方战争震动华北"
 B80_opponents.80.d: "边境枪声刚响，各国电台就开始播报。地方守军正向外求援，国民政府与日本也在判断这是一场短暂冲突，还是八十中全面改写华北秩序的开端。"
 B80_opponents.80.a: "在外国作出决定前结束战争"
 B80_opponents.80.b: "立即请求路线赞助国提供军援"
 B80_opponents.80.c: "宣布有限目标，给调停留下窗口"
 B80_opponents.81.t: "是否干预八十中的地方战争？"
 B80_opponents.81.d: "遭到进攻的地方势力要求立即援助。只送武器可以控制风险，直接参战则可能彻底阻止八十中扩张；袖手旁观最安全，却会让我们今后的保证失去分量。"
 B80_opponents.81.a: "提供武器、顾问与边疆动员方案"
 B80_opponents.81.b: "兑现保证，强制介入这场战争"
 B80_opponents.81.c: "这不是我们要打的战争"
 B80_opponents.84.t: "是否介入鲁系战争？"
 B80_opponents.84.d: "鲁系军阀请求国民政府兑现对华北秩序的承诺。军援可以拖慢八十中的推进，正式参战则可能封死其山东方向；拒绝干预最安全，却会把济南以北的主动权拱手让人。"
 B80_opponents.84.a: "向鲁系提供武器与顾问"
 B80_opponents.84.b: "正式介入鲁系一侧"
 B80_opponents.84.c: "山东不值得扩大这场战争"
 B80_opponents.85.t: "是否介入蒙疆战争？"
 B80_opponents.85.d: "蒙疆方面请求日本立即干预八十中的进攻。东京可以先以武器和顾问强化草原防线，也可以直接将这场边境战争纳入自身战略。"
 B80_opponents.85.a: "向蒙疆输送军火与顾问"
 B80_opponents.85.b: "正式介入蒙疆一侧"
 B80_opponents.85.c: "让他们自己守住草原"
 B80_opponents.86.t: "是否介入满洲战争？"
 B80_opponents.86.d: "满洲国遭到八十中进攻，日本在大陆的整个战略支点都受到威胁。提供军援可以保留回旋余地，直接参战则意味着与八十中彻底摊牌。"
 B80_opponents.86.a: "向满洲增派武器与顾问"
 B80_opponents.86.b: "正式介入满洲一侧"
 B80_opponents.86.c: "暂不把冲突扩大为全面战争"
 B80_opponents.82.t: "外国介入地方战争"
 B80_opponents.82.d: "敌军仓库里出现了新制式武器，外国顾问也开始重新编排防线。对方已经选择了参与程度：无论是军援还是正式介入，这场战争都不再只属于边境两侧。"
 B80_opponents.82.a: "那就连他们的计划一起击败"
 B80_opponents.83.t: "赞助国军援抵达"
 B80_opponents.83.d: "经由我们政治路线建立的国际渠道开始运转。顾问、枪械、通信器材与外交掩护陆续抵达望京；赞助者各有自己的理由，但这些物资现在由八十中使用。"
 B80_opponents.83.a: "先赢下战争，再讨论他们的期待"

 B80_opponents.90.t: "地方政府在校门前降旗"
 B80_opponents.90.d: "旧机关的印章、档案和钥匙已经交到我们手中。吞并完成得越公开，支持者越振奋，外国也越警觉；处理得越克制，外界就越难把这次胜利包装成下一场战争的证据。"
 B80_opponents.90.a: "给投降官员留一间联合办公室"
 B80_opponents.90.b: "向全校广播这场完整胜利"
 B80_opponents.90.c: "安静接管，只把门牌换掉"
 B80_opponents.91.t: "八十中吞并了又一个地方势力"
 B80_opponents.91.d: "原本用来缓冲八十中的地方政权已经从地图上消失。承认既成事实可以保住沟通渠道，制裁能够表达代价，而备战则意味着我们相信下一次边界变化会指向自己。"
 B80_opponents.91.a: "承认既成事实，要求其承担秩序"
 B80_opponents.91.b: "扩大制裁，让扩张付出代价"
 B80_opponents.91.c: "不再等待，立即开始备战"
 B80_opponents.92.t: "外国回应我们的吞并"
 B80_opponents.92.d: "使馆的回复已经送达。有的国家勉强承认新边界，有的开始封锁交易，还有的把部队调向前线。地方战争结束了，但它留下的外交后果才刚刚开始。"
 B80_opponents.92.a: "把这份回复放进下一次会议材料"

 B80_opponents.100.t: "世界承认八十中"
 B80_opponents.100.d: "经历观察团、照会、制裁与危机之后，越来越多的政府接受了一个事实：八十中不是等待被清除的地图异常，而是能够谈判、履约并维护秩序的国家。正式承认接连抵达望京，校门外第一次排起的不是食堂队，而是外交车辆。"
 B80_opponents.100.a: "从一所学校，到国际席位"

 B80_open_campus_diplomacy: "开放校园外交"
 B80_open_campus_diplomacy_desc: "公开课堂、预算与行政流程削弱了外国最夸张的指控，也让国际部能够把校园生活本身变成一张可信的名片。"
 B80_closed_campus_security: "封闭式校园安全"
 B80_closed_campus_security_desc: "观察团只能看见我们愿意展示的走廊。严密门禁保护了军事秘密，却也让外界更容易相信最坏的猜测。"
 B80_patron_dependency: "对赞助国的依赖"
 B80_patron_dependency_desc: "外国援助填补了物资与外交缺口，但每一批货物都带着看不见的回执。我们获得安全，也不得不为赞助者的期待留出座位。"
 B80_border_observers: "边境观察团"
 B80_border_observers_desc: "佩戴臂章的外国观察员沿边界巡查并提交报告。他们降低了误判风险，同时也把我们的部署写进了国际档案。"
 B80_targeted_sanctions: "针对八十中的定向制裁"
 B80_targeted_sanctions_desc: "设备、信贷与关键原料被列入审查清单。制裁没有完全封锁校园，却让每一项建设都多了一道昂贵手续。"
 B80_campus_self_reliance: "校园自力更生"
 B80_campus_self_reliance_desc: "实验室维修旧设备，社团工坊改造零件，食堂供应链承担起国家后勤。外界想用短缺迫使我们退让，我们就把短缺变成课程。"
 B80_frontier_mobilization: "边疆动员"
 B80_frontier_mobilization_desc: "面对八十中的压力，地方机关、乡团和残余部队被统一编入守备体系。他们未必善于进攻，却熟悉每一条必须守住的道路。"
 B80_foreign_arms_mission: "外国军援团"
 B80_foreign_arms_mission_desc: "新武器与顾问一同抵达地方军营。援助者不必亲自宣战，也能让八十中的每一步推进变得更加昂贵。"
 B80_containment_defense_plan: "联合遏制防御计划"
 B80_containment_defense_plan_desc: "各国参谋开始共享警报、部署与补给方案。原本分散的边境线被视作同一道防线，核心目标只有一个：阻止八十中继续扩张。"
 B80_internationally_recognized_campus: "国际承认的校园政权"
 B80_internationally_recognized_campus_desc: "外交承认把八十中从一项“地方问题”变成了条约上的签字方。贸易、联络与海外合作不再需要先解释我们为何存在。"
 B80_encircled_campus_mobilization: "受困校园动员"
 B80_encircled_campus_mobilization_desc: "当最后通牒抵达，全校的争论暂时让位于防务。教室、社团与工厂各自接下任务，包围带来的不是瘫痪，而是共同守住校门的决心。"
 B80_boundary_freeze_inspection: "边界冻结与核查"
 B80_boundary_freeze_inspection_desc: "依照危机协议，我们暂时停止扩张并允许观察员核验边境活动。这换来了和平，也限制了八十中主动改变局势的能力。"
 B80_wartime_foreign_support: "战时外国援助"
 B80_wartime_foreign_support_desc: "赞助国的装备、通信专家和外交掩护正沿既定渠道抵达。它不会替学生打完整场战争，却能让我们的战争机器保持运转。"

 B80_expansion_alarm_opinion: "警惕八十中的扩张"
 B80_recognized_campus_opinion: "承认校园政权"
 B80_mediated_crisis_opinion: "和平化解校园危机"
 B80_supported_our_enemy_opinion: "援助我们的敌人"
 B80_patron_of_campus_opinion: "校园政权的赞助者"
