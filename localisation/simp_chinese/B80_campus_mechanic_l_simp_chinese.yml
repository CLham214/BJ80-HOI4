l_simp_chinese:
 B80_campus_semester_category: "望京学期议程"
 B80_campus_semester_category_desc: "八十中的战争机器并不只在兵工厂里运转，也藏在每一张课程表、每一次社团招新和每一条食堂队伍之中。每个学期可安排§Y3§!项重点项目；完成§Y学校属于学生§!后，学生代表会将开放第§Y4§!个席位。\n\n§Y第[?ROOT.B80_semester_number|Y0]学期§!　已安排项目：§Y[?ROOT.B80_semester_projects|Y0]§!\n学业进度：§Y[?ROOT.B80_academic_progress|Y0]§!/100\n£stability_texticon  校园活力：§Y[?ROOT.B80_campus_vitality|Y0]§!/100\n£pol_power  升学压力：§Y[?ROOT.B80_admission_pressure|Y0]§!/100\n£world_tension_icon  学校声望：§Y[?ROOT.B80_school_reputation|Y0]§!\n\n学期结束时，学业与活力是否均衡、升学压力是否失控，以及本学期选择过哪些项目，都会改变期末结算。"

 B80_initialize_campus_mechanic: "召开新学期筹备会"
 B80_initialize_campus_mechanic_desc: "把课程表、社团场地、食堂窗口和跑操安排一起摊到会议桌上。该决议仅供加入本机制前创建的旧存档补充启用。"
 B80_initialize_campus_mechanic_tt: "为旧存档启用§Y望京学期议程§!，设定初始校园指标并开始第一个学期。"
 B80_semester_countdown: "本学期教学进程"
 B80_semester_countdown_desc: "铃声照常响起，试卷照常发下，活动室的灯也照常亮到很晚。学期结束时，学校将根据各项校园指标形成一份真正影响国家的成绩单。"
 B80_semester_countdown_tt: "本学期结束后触发§Y学期总结§!，结算项目组合并开启下一学期。"

 B80_wangxuan_informatics_project: "王选信科专项"
 B80_wangxuan_informatics_project_desc: "让机房、信息竞赛队与工业部门共享算力和人才。程序可以拿奖，也可以优化一整套国家机器。"
 B80_wangxuan_informatics_project_tt: "显著提高§Y学业进度§!和§Y学校声望§!，但会增加§Y升学压力§!；并获得电子与计算技术方面的收益。"
 B80_wangshouguan_science_project: "王绶琯科学人才班"
 B80_wangshouguan_science_project_desc: "在问题还没有标准答案之前就开始追问。真正的科学教育不是背下结论，而是让学生敢于把未知写进实验报告。"
 B80_wangshouguan_science_project_tt: "提高§Y学业进度§!与§Y学校声望§!，推动专业科研突破，同时小幅增加§Y升学压力§!。"
 B80_math_physics_project: "数理联合攻坚周"
 B80_math_physics_project_desc: "数学老师说物理题最终还是数学题，物理老师则坚持公式必须落到现实。让两边在同一间教室里把争论变成成果。"
 B80_math_physics_project_tt: "提高§Y学业进度§!，获得工业或工程研究收益；密集训练会增加§Y升学压力§!。"
 B80_hundred_clubs_project: "百团招新季"
 B80_hundred_clubs_project_desc: "天文、机器人、辩论、戏剧、模拟联合国……如果某种兴趣还没有社团，学生们多半会在今天下午新建一个。"
 B80_hundred_clubs_project_tt: "大幅提高§Y校园活力§!、降低§Y升学压力§!，并触发§Y百团招新§!事件以选择本学期的社团浪潮。"
 B80_cafeteria_reform_project: "整顿食堂长队"
 B80_cafeteria_reform_project_desc: "食堂足够大，队伍却总能更长。问题或许不在于没有窗口，而在于全校人同时冲向同一扇门。"
 B80_cafeteria_reform_project_tt: "触发§Y食堂长队§!事件。可以接受抢饭现实、推行错峰就餐，或投资扩建供餐体系。"
 B80_running_policy_project: "重议跑操制度"
 B80_running_policy_project_desc: "跑操很烦；不跑似乎也没人管。究竟要严格点名、象征性跑两圈，还是把自由活动写进制度，现在该给出一个答案。"
 B80_running_policy_project_tt: "触发§Y操场上少了谁？§!事件，在训练收益、校园活力与升学压力之间选择。"
 B80_engineering_practice_project: "校园工程实践周"
 B80_engineering_practice_project_desc: "把模型、图纸和实验样机从展示柜里拿出来。今天焊的是社团作品，明天就可能成为生产线上的标准件。"
 B80_engineering_practice_project_tt: "获得生产与装备方面的即时收益，并提高§Y学业进度§!；赶工会略微消耗§Y校园活力§!。"
 B80_international_exchange_project: "国际课程交流月"
 B80_international_exchange_project_desc: "从望京出发，与海外校园交换课程、学生与观点。八十中的校门不该成为知识流动的边界。"
 B80_international_exchange_project_tt: "同时提高§Y学业进度§!、§Y校园活力§!和§Y学校声望§!，并带来国际交流收益。"
 B80_wartime_curriculum_project: "战时课程表"
 B80_wartime_curriculum_project_desc: "前线不会因为期中考试而停火。实验室转向军需，体育课转为训练，社团仓库也要开始清点能用的器材。"
 B80_wartime_curriculum_project_tt: "仅能在战争中安排。获得军队经验、装备和战争支持，但会明显消耗§Y校园活力§!并提高§Y升学压力§!。"

 B80_recruit_ruide_cohort: "吸纳睿德项目生"
 B80_recruit_ruide_cohort_desc: "睿德的培养方式与望京本部并不完全相同。把一届项目生真正纳入共同课程，需要决定他们将在哪个方向发挥专长。"
 B80_recruit_ruide_cohort_tt: "消耗§Y25学校声望§!，120天后触发§Y睿德新一届项目生§!事件，并选择一项持续两个学期的培养方向。"
 B80_invite_academician: "邀请院士进校园"
 B80_invite_academician_desc: "一次真正精彩的报告能让许多学生第一次意识到：课本最后一页之外，还有一整片尚未被回答的世界。"
 B80_invite_academician_tt: "消耗§Y25学校声望§!，大幅推进§Y学业进度§!并获得§Y院士讲堂§!。"
 B80_host_education_forum: "主办望京教育论坛"
 B80_host_education_forum_desc: "把兄弟学校、大学和研究机构请进校园。声望只有被用于汇聚资源时，才不只是橱窗里的奖牌。"
 B80_host_education_forum_tt: "消耗§Y40学校声望§!，触发§Y望京教育论坛§!事件，可在校际合作、大学联名和成果转化之间选择。"
 B80_activate_alumni_network: "动员八十校友网络"
 B80_activate_alumni_network_desc: "毕业证并不会让人与校园失去联系。当前线告急，散布各地的校友可以带着技术、人脉与物资重新回到队伍中。"
 B80_activate_alumni_network_tt: "仅能在战争中启用。消耗§Y35学校声望§!，获得人力、装备和后勤援助。"

 B80_semester_project_slot_tt: "将占用本学期§Y1§!个重点项目席位。"
 B80_semester_slots_full_tt: "本学期仍有可用的重点项目席位。"
 B80_student_fourth_slot_tt: "完成§Y学校属于学生§!后，每学期可安排的重点项目由§Y3§!项增加至§Y4§!项。"
 B80_campus_values_clamped_tt: "所有校园指标均在§Y0§!至§Y100§!之间变化。"
 B80_reputation_spending_tt: "§Y学校声望§!是一种可积累并用于校外行动的资源，不会在学期结束时自动清零。"
 B80_new_semester_tt: "清空本学期项目记录，开始下一学期。"

 B80_admission_pressure_relaxed: "压力刻度：过于松弛"
 B80_admission_pressure_relaxed_desc: "校园里有笑声，也有不少人开始把明天的任务留给后天。喘息是必要的，但太久没有目标，学业节奏也会慢下来。"
 B80_admission_pressure_balanced: "压力刻度：张弛有度"
 B80_admission_pressure_balanced_desc: "该认真时认真，该活动时活动。压力仍然存在，却还没有挤走好奇心和睡眠。"
 B80_admission_pressure_intense: "压力刻度：晚自习加时"
 B80_admission_pressure_intense_desc: "卷子翻页的声音比下课铃更清楚。成绩在上升，但校园生活已经开始为进度让路。"
 B80_admission_pressure_all_out: "压力刻度：全员冲刺"
 B80_admission_pressure_all_out_desc: "走廊里的话题只剩排名、竞赛与志愿表。高压确实能换来短期成果，却也在消耗学校最宝贵的精力。"
 B80_admission_pressure_breaking_point: "压力刻度：临界点"
 B80_admission_pressure_breaking_point_desc: "每个人都还坐在教室里，但注意力、耐心和士气已经先一步离席。若再不调整，任何新的任务都会变得格外沉重。"

 B80_cafeteria_queue: "超大但依旧排不上队的食堂"
 B80_cafeteria_queue_desc: "座位很多，窗口很多，人更多。午餐时间的真正考验不是吃什么，而是能否在下午第一节课前端着餐盘坐下。"
 B80_staggered_cafeteria: "错峰就餐制度"
 B80_staggered_cafeteria_desc: "几个年级相差十分钟下课，便足以让队伍从一场战役变回一顿午饭。代价是课程表从此像铁路时刻表一样精密。"
 B80_central_cafeteria_system: "八十中央供餐体系"
 B80_central_cafeteria_system_desc: "新增窗口、预制分流和统一调度终于把大食堂的规模变成优势。若它能准时喂饱全校，也就能准时供应一支军队。"

 B80_club_science_wave: "社团浪潮：科学无界"
 B80_club_science_wave_desc: "天文镜旁架起了无人机，机器人社又从化学社借走了传感器。不同兴趣之间的偶遇，正在催生正式课程无法计划的发明。"
 B80_club_arts_wave: "社团浪潮：舞台常亮"
 B80_club_arts_wave_desc: "排练厅、画室和礼堂直到晚间仍灯火通明。艺术不能直接完成生产指标，却让人们记得为何值得完成它们。"
 B80_club_media_wave: "社团浪潮：校园发声"
 B80_club_media_wave_desc: "校刊、广播、摄影与辩论社把校园里的每一件事变成公共议题。信息流动得更快，沉默的意见也终于有人记录。"
 B80_club_everything_wave: "社团浪潮：什么都有"
 B80_club_everything_wave_desc: "没有人能说清今天一共成立了多少社团。唯一确定的是，只要有人愿意负责、有人愿意参加，一张新桌子总能被挤出来。"

 B80_compulsory_running: "跑操制度：严格点名"
 B80_compulsory_running_desc: "队列整齐、口号响亮、缺席名单同样清楚。体能和纪律得到提升，而操场也成了每天最容易积累怨气的地方。"
 B80_symbolic_running: "跑操制度：象征两圈"
 B80_symbolic_running_desc: "跑还是要跑，点名也还存在，只是没人打算把早晨变成一次军事演习。至少两圈之后，大家仍有力气爬上教学楼。"
 B80_skip_running: "跑操制度：自愿参加"
 B80_skip_running_desc: "操场上留下真正想跑的人，其他学生把时间还给睡眠、早饭或教室。队列不再壮观，校园气氛倒是明显轻松了。"

 B80_exam_sprint: "考前冲刺周"
 B80_exam_sprint_desc: "知识点被压进最后几天，咖啡和错题本共同维持着秩序。这种效率不可能长久，却足够跨过眼前的考试。"
 B80_balanced_semester: "学期成果：一人一天地"
 B80_balanced_semester_desc: "学业没有吞掉生活，活动也没有冲散目标。每个人都在自己的方向上生长，而整所学校因此拥有了共同的力量。"
 B80_academic_semester: "学期成果：竞赛机器"
 B80_academic_semester_desc: "奖项、论文和考试成绩接连送进办公室。即便走廊安静得过了头，也没人能否认这是一段成果惊人的学期。"
 B80_vibrant_semester: "学期成果：百团盛放"
 B80_vibrant_semester_desc: "礼堂排练、操场比赛、教室里展示模型。校园像一座永不熄灯的城市，学生的热情本身就是最充足的资源。"
 B80_practical_semester: "学期成果：把图纸变成实物"
 B80_practical_semester_desc: "本学期没有最多的奖状，却留下了真正能运转的设备、流程和生产线。实践课最终给国家交出了一份沉甸甸的作业。"
 B80_lunch_rush_instinct: "抢饭本能"
 B80_lunch_rush_instinct_desc: "下课铃一响，路线规划、快速机动和队伍穿插完全不需要教师讲解。长期食堂排队让所有人掌握了某种奇特的战术素养。"
 B80_wangjing_education_model: "望京教育范式"
 B80_wangjing_education_model_desc: "连续多个学期证明，成绩、创造力和校园生活并非只能三选一。八十中把一套校园经验建设成了可复制的国家制度。"

 B80_ruide_science_cohort: "睿德项目生：科学方向"
 B80_ruide_science_cohort_desc: "这一届项目生被编入实验室与科学人才班。他们带来的不同课程背景，正在让研究小组重新审视习以为常的答案。"
 B80_ruide_humanities_cohort: "睿德项目生：人文方向"
 B80_ruide_humanities_cohort_desc: "历史、语言与社会研究成为这一届项目生的重点。国家机器需要工程师，也需要能解释它为何运转的人。"
 B80_ruide_engineering_cohort: "睿德项目生：工程方向"
 B80_ruide_engineering_cohort_desc: "从设计到加工再到测试，这一届项目生将课堂知识直接带进工坊。坏掉的样机不是失败，而是下一版图纸的开头。"
 B80_ruide_allround_cohort: "睿德项目生：全人方向"
 B80_ruide_allround_cohort_desc: "不把学生提前固定在一条赛道上。科学、人文、体育和社团共同进入课程表，让每个人先找到自己的天地。"
 B80_academician_lecture: "院士讲堂"
 B80_academician_lecture_desc: "讲台上的问题没有标准答案，台下举起的手却越来越多。与真正探索未知的人面对面，远比又一套练习册更能点燃好奇心。"

 B80_campus.1.t: "望京的新学期"
 B80_campus.1.d: "清晨的望京，教学楼窗户逐层亮起。教务处摆出了竞赛与课程计划，社团代表抱来厚厚一摞场地申请，食堂仍在为午间人流发愁，体育组则再次提出要不要严格检查跑操。\n\n从今天开始，每一项校园安排都会积累成八十中的国家能力。我们可以追求耀眼的成绩，也可以保护校园生活；真正困难的是在升学压力之下，让两者共同生长。"
 B80_campus.1.a: "排出第一张学期课程表。"
 B80_campus.1_tt: "§Y望京学期议程§!现已启用。每学期安排重点项目，并在学期末根据校园指标获得不同成果。"

 B80_campus.10.t: "第[?B80_semester_number|0]学期成绩单"
 B80_campus.10.d: "最后一场考试结束，活动室陆续关灯，行政楼收到了一整学期的统计：学业成果、校园活动、压力变化，以及那些没有办法写进分数的成长。现在，该判断这张课程表究竟把八十中带向了哪里。"
 B80_campus.10.a: "把成绩单贴到公告栏。"

 B80_campus.11.t: "一人一天地"
 B80_campus.11.d: "竞赛队带回成果时，礼堂里正进行社团汇演；实验室有人讨论新问题，操场上也有人自愿多跑了一圈。这个学期没有让所有人走同一条路，却让每条路都通向了更好的校园。"
 B80_campus.11.a: "让生命因教育而精彩。"
 B80_campus.11.b: "把这套经验写进下一学期的制度。"

 B80_campus.12.t: "竞赛机器全速运转"
 B80_campus.12.d: "奖状、排名和研究成果堆满了办公桌。密集课程证明了八十中的学术实力，疲惫的学生也证明了这种速度并非没有代价。是继续乘胜冲刺，还是趁现在给校园松一口气？"
 B80_campus.12.a: "保持速度，下一场比赛还在等着。"
 B80_campus.12.b: "成果已经足够，安排一次减压周。"

 B80_campus.13.t: "百团盛放"
 B80_campus.13.d: "几乎每间空教室都被某个社团占用，操场、礼堂与实验室也排满了活动。有人担心课业时间被挤压，但更多人第一次在课程表之外找到了愿意长期投入的事情。"
 B80_campus.13.a: "把校园活力变成全国声望。"
 B80_campus.13.b: "趁热把创意带进实验室和工坊。"

 B80_campus.14.t: "实践课交出的国家作业"
 B80_campus.14.d: "从社团模型到正式图纸，从临时维修台到稳定生产线，本学期最亮眼的成果不是一张奖状，而是一批能够真正投入使用的设备。学生们已经证明，知识离开试卷后同样有力量。"
 B80_campus.14.a: "让工坊继续运转。"
 B80_campus.14.b: "把成果优先送往前线。"

 B80_campus.15.t: "压力抵达临界点"
 B80_campus.15.d: "教室仍然坐满了人，空气却像一根拉紧的弦。成绩没有立刻崩塌，迟到、争执和失神却越来越常见。再多安排一次考试也许还能换来短期进步，但这所学校已经需要一次真正的选择。"
 B80_campus.15.a: "安排心理健康与自主活动周。"
 B80_campus.15.b: "咬牙冲过下一场考试再说。"
 B80_campus.15.c: "让社团接管校园一周。"

 B80_campus.16.t: "平稳但普通的一学期"
 B80_campus.16.d: "课程照常完成，社团照常活动，食堂队伍也照常从窗口排到门外。这张成绩单没有危机，也没有足以写进校史的高峰。平稳本身并非坏事，但下一学期最好有一个更明确的方向。"
 B80_campus.16.a: "把更多资源投向学业。"
 B80_campus.16.b: "先把校园活力找回来。"
 B80_campus.16.c: "继续均衡探索。"

 B80_campus.20.t: "百团招新：走廊已经不够用了"
 B80_campus.20.d: "午后的校园像一场小型博览会。机器人在桌边转向，乐队隔着两层楼还能听见，辩论队正试图证明自己的摊位不算占道，摄影社则记录下了全部混乱。有限的场地必须有所倾斜，但学生显然希望什么都留下。"
 B80_campus.20.a: "优先保障科学与技术社团。"
 B80_campus.20.b: "把礼堂交给艺术与表演社团。"
 B80_campus.20.c: "支持校刊、广播与公共表达。"
 B80_campus.20.d_option: "谁也不砍——再挤几张桌子！"

 B80_campus.30.t: "食堂很大，队伍更大"
 B80_campus.30.d: "午间铃声刚响，楼梯便形成一股朝食堂移动的人潮。最先到达的学生已经端走餐盘，队尾的人还在教学楼门口。有人主张练好冲刺，有人要求错峰下课，也有人把新增窗口的预算案拍在桌上。"
 B80_campus.30.a: "下课铃就是发令枪。"
 B80_campus.30.b: "各年级错峰十分钟就餐。"
 B80_campus.30.c: "扩建窗口，建立中央供餐体系。"

 B80_campus.40.t: "操场上少了谁？"
 B80_campus.40.d: "广播已经放起音乐，队伍中却留下几处十分自然的空位。跑操令人烦躁，而缺席似乎也很少有人追究。体育组、学生代表和年级主任各有一套方案，现在必须把这种长期模糊写成明确制度。"
 B80_campus.40.a: "严格点名，把跑操变成纪律训练。"
 B80_campus.40.b: "象征性跑两圈，别耽误早饭。"
 B80_campus.40.c: "不再点名，自愿参加。"

 B80_campus.50.t: "睿德新一届项目生"
 B80_campus.50.d: "一批来自睿德项目的学生走进望京校园。他们熟悉不同的课程节奏，也带来了新的兴趣与方法。与其让他们简单并入原有班级，不如为这一届设计一条能真正发挥长处的培养路径。"
 B80_campus.50.a: "编入科学人才班与实验室。"
 B80_campus.50.b: "加强语言、人文与社会研究。"
 B80_campus.50.c: "进入工坊，主攻工程实践。"
 B80_campus.50.d_option: "不急着分流，采用全人培养。"

 B80_campus.60.t: "望京教育论坛"
 B80_campus.60.d: "兄弟学校的代表、大学学者和研究机构齐聚八十中。礼堂里的发言讨论教育，走廊里的交谈却已经开始安排合作项目。我们积累的声望足以推动一项真正超出校园边界的计划。"
 B80_campus.60.a: "建立校际课程与师资共享网络。"
 B80_campus.60.b: "与大学联名建设联合实验室。"
 B80_campus.60.c: "让科研成果直接进入国家生产体系。"
